<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="some-div">
        <div class="inner-div">
            <div class="small">

            </div>
        </div>
        <div class="inner-div">
            <div class="battery">

            </div>

        </div>
        <div class="inner-div" style="background-color: aqua;">

        </div>

    </div>
    <style>
        .some-div{
            border-style: solid;
            height: 50%;
            width: 80%;
            margin: 0 auto;
        }
        .inner-div{
            border-style: solid;
            height: 100px;
            width: 90%;
            margin: 0 auto;
            margin-top: 7%;
            margin-bottom: 7%;
        }
        .battery{
            height: 100%;
            width: 50%;
            background-color: cadetblue;
        }
        .small{
            height: 100%;
            width: 30%;
            background-color: rgb(153, 0, 255);
        }
    </style>
    
</body>
</html>
